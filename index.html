if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('t');

/* ---------- world ---------- */
const WW=1600,WH=836,PW=30,PH=34,LX=22,RX=1570,GI=18;
const PL=[[22,304,133],[191,384,99],[48,451,100],[334,451,210],[22,536,358],[323,626,227],[106,707,183],[572,354,209],[764,277,209],[606,451,365],[538,536,482],[837,586,203],[956,354,332],[1154,284,201],[1455,399,73],[1161,512,273],[1148,622,195],[1046,712,446],[22,800,1548]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[1]==800?36:14}));
const RAMP=[],CRATE=[{x:1383,y:487,w:26,h:25},{x:1409,y:487,w:26,h:25},{x:1409,y:461,w:26,h:26}];

/* ---------- audio ---------- */
let AC;function snd(f,d,t='square',v=.05,s=0){if(MUTE||QUIET)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- input ---------- */
const K={},T={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});

document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();T[k]=1;b.classList.add('on')},off=e=>{T[k]=0;b.classList.remove('on')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
addEventListener('blur',()=>{for(const k in K)K[k]=0;for(const k in T)T[k]=0;document.querySelectorAll('#tc button.on').forEach(b=>b.classList.remove('on'))});
addEventListener('contextmenu',e=>e.preventDefault());
function human(){return{l:K.KeyA||K.ArrowLeft||T.l,r:K.KeyD||K.ArrowRight||T.r,j:K.KeyW||K.ArrowUp||K.Space||T.j,d:0}}
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

/* ---------- state ---------- */
const COLS=['#2b8cff','#ff4a3d','#ffd23f','#a45cff','#2ee6a6'],BASE=location.origin+location.pathname;
function mk(id,x,y){return{pl:GI,id,x,y,vx:0,vy:0,g:0,coy:0,buf:0,pj:0,cut:0,drop:0,face:1,sq:1,it:0}}
let emaDt=.016,lastQ=0,room=null,myId='',code='',name='',isHost=false,peers=[],rem={},parts=[],shake=0,time=0,tleft=100,cd=0,cdS=9,mi=0,mus=0,toastT,lastBoard='';
const PHYS_HZ=60,SEND_S=0,INTERP_MIN=16,INTERP_MAX=70,EXTRAP_MS=120,PUB_SIZE=5;   /* PUB_SIZE: players needed before a public match starts */
const S={mode:'menu',gm:0,rn:0,rs:-1,st:'lobby',bt:null,ov:null,rm:null,practice:false,tl:null,tlAt:0,cdl:0,cdAt:0,lc:0,lcAt:0},ME=mk(0,700,500),NEUT={},PEND=[],OUT=[],VO={x:0,y:0};let seq=0;
ME.alive=true;ME.ci=0;
let cam={x:800,y:418,z:.6};
const AR={h:null,ox:0,oy:0,px:0,py:0,pop:0};   /* AR: the glide of the arrow between heads */
const ovShow=h=>{ov.innerHTML=h;ov.classList.remove('off','fit');ov.style.opacity='';ov.scrollTop=0;scrollTo(0,0)},ovHide=()=>ov.classList.add('off');
function toast(t,ms=1600){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms)}
function lockLand(){if(!matchMedia('(pointer:coarse)').matches)return;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
function jingle(w){(w?[523,659,784,1047,1319]:[392,330,262,196]).forEach((f,i)=>setTimeout(()=>snd(f,.25,'square',.06),i*130))}
function startMusic(){if(mus)return;mus=setInterval(()=>{if(MUTE||S.mode!='play')return;const n=[0,3,7,10,12,10,7,3];snd(220*Math.pow(2,n[mi++%8]/12),.22,'triangle',.022);if(mi%2==0)snd(110*Math.pow(2,[0,0,5,7][(mi>>1)%4]/12),.3,'sine',.03)},230)}

/* ---------- screens ---------- */
function menu(msg){S.mode='menu';S.rm=null;S.pub=0;S.mf=0;S.mfGo=0;document.body.classList.remove('pl');$('leave').style.display='none';$('timer').textContent='';
 let sv='';try{sv=localStorage.getItem('tagname')||''}catch(e){}
 const q=(location.search+location.hash+document.referrer).match(/room=([a-z0-9]{3,6})/i);
 ovShow(`<h1>TAG</h1><input id="nm" maxlength="12" placeholder="Your name" value="${esc(sv)}"><button class="b" onclick="enterPublic()">▶ PLAY</button><div id="onl" style="font-size:16px;opacity:.9;min-height:20px"></div><div class="row"><button class="b alt sm" onclick="enter(1)">Create room</button><input id="cd" maxlength="5" placeholder="Room code" value="${q?esc(q[1].toUpperCase()):''}" style="width:160px;text-transform:uppercase"><button class="b alt sm" onclick="enter(0)">Join</button></div><p id="msg">${msg||'Tap PLAY for a public match of '+PUB_SIZE+', or make a private room for friends. Whoever holds the arrow when the timer hits 0 is out. Last one standing wins.'}</p>`);fetchStats()}
async function enter(host){if(S.joining)return;S.joining=1;try{await enter0(host?'create':'join')}finally{S.joining=0}}
async function enterPublic(){if(S.joining)return;S.joining=1;try{await enter0('quick')}finally{S.joining=0}}
function playAgain(){leaveRoom();enterPublic()}
/* open a socket and send the first message (quick / create / join / resume); resolves on the server's "hello". Later messages go to onMsg. */
function openWS(url,first,wait){return new Promise((resolve,reject)=>{
 let ws,done=0,to=0;
 const fail=c=>{if(done)return;done=1;clearTimeout(to);try{ws&&ws.close()}catch(e){}reject({code:c})};
 try{ws=new WebSocket(url)}catch(e){return reject({code:'ws'})}
 to=setTimeout(()=>fail('timeout'),wait||12000);
 ws.onopen=()=>{try{ws.send(JSON.stringify(first))}catch(e){fail('send')}};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(!done){if(m.t=='hello'){done=1;clearTimeout(to);resolve({ws,hello:m})}else if(m.t=='err')fail(m.e||'closed');return}
  onMsg(m,ws)};

async function enter0(kind){
 const nmEl=$('nm'),nm=((nmEl?nmEl.value:name)||'').trim().slice(0,12)||'Player';name=nm;try{localStorage.setItem('tagname',nm)}catch(e){}
 let jc='';
 if(kind=='join'){jc=$('cd').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(jc.length<3)return $('msg').textContent='Enter a room code first.'}
 try{document.activeElement&&document.activeElement.blur()}catch(e){}scrollTo(0,0);lockLand();startMusic();try{AC&&AC.resume&&AC.resume()}catch(e){}
 $('msg').textContent=kind=='quick'?'Finding a match…':'Connecting…';
 const WS_URL=window.TAG_WS||((location.protocol=='https:'?'wss://':'ws://')+location.host);
 const first=kind=='quick'?{t:'quick',nm}:kind=='create'?{t:'create',nm}:{t:'join',code:jc,nm};
 let o=null,jerr=null;
 for(let at=0;at<3&&!o;at++){
  try{o=await openWS(WS_URL,first,at?25000:12000)}
  catch(e){jerr=e;if(e&&(e.code=='full'||e.code=='bad'||e.code=='nf'))break;if(at<2){const mg=$('msg');if(mg)mg.textContent='Waking up the server… (free hosting can take up to a minute)';await new Promise(r=>setTimeout(r,1500))}}}
 if(!o){const c=jerr&&jerr.code;return menu(c=='full'?'Room is full (5 players max).':c=='bad'?'Invalid room code.':c=='nf'?'Room not found. Check the code.':'Could not reach the server ('+(c||'error')+'). Try again in a moment.')}
 const h=o.hello;myId=h.id;
 room={ws:o.ws,id:h.id,tk:h.tk,rk:h.rk,url:WS_URL,left:0,rx:Date.now(),resuming:0};

function resetMatch(){S.rn=0;S.gm=0;S.rs=-1;S.bt=null;S.ov=null;S.st='lobby';S.practice=false;S.tl=null;S.cdl=0;S.lc=0;S.lastN=null;S.psig='';S.mc=0;S.sig='';S.lobCode=null;PEND.length=0;OUT.length=0;VO.x=VO.y=0;ME.alive=true;ME.it=0;rem={};peers=[];isHost=false;cd=0}
function netSend(m){const w=room&&room.ws;if(w&&w.readyState==1)w.send(JSON.stringify(m))}
/* a dropped connection keeps your character on the server for ~15 s: we silently reconnect and carry on */
function onClose(ws){if(!room||room.ws!==ws||room.left)return;toast('Connection lost. Reconnecting…',3000);tryResume()}
async function tryResume(){
 const R=room;if(!R||R.resuming)return;R.resuming=1;const t0=performance.now();
 while(room===R&&!R.left&&performance.now()-t0<12000){
  try{const o=await openWS(R.url,{t:'resume',rk:R.rk,id:R.id,tk:R.tk},4000);if(room!==R||R.left){try{o.ws.close()}catch(e){}return}R.ws=o.ws;R.rx=Date.now();R.resuming=0;toast('Reconnected',1000);return}
  catch(e){if(e&&e.code=='gone')break;await new Promise(r=>setTimeout(r,700))}}

function leaveRoom(msg){if(room){room.left=1;try{room.ws&&room.ws.close()}catch(e){}}room=null;S.rm=null;rem={};isHost=false;peers=[];menu(typeof msg=='string'?msg:'')}
function fitLobby(){const w=$('lobw');if(!w)return;w.style.transform='none';const k=Math.min(1,(innerHeight-24)/w.offsetHeight,(innerWidth-24)/w.offsetWidth);w.style.transform=k<1?'scale('+k+')':'none'}
addEventListener('resize',()=>setTimeout(fitLobby,60));
function lobbyUI(f){
 if(S.pub)return pubUI(f);
 const sig=peers.map(p=>p.peer+(p.presence.nm||'')+(p.presence.host||0)+(p.presence.ci||0)).join()+isHost;
 if(!f&&S.sig===sig&&$('lob'))return;S.sig=sig;
 const list=`Players ${peers.length}/5${peers.map(p=>`<div class="chip"><span class="dot" style="background:${COLS[p.presence.ci||0]}"></span>${esc(p.presence.nm||'Player')}${p.presence.host==1?' ★':''}${p.isMe?' (you)':''}</div>`).join('')}`;
 const act=isHost?`<button class="b" onclick="hostStart()">${peers.length<2?'Start solo practice':'Start game'}</button>`:'<p>Waiting for the host to start…</p>';
 if($('lob')&&S.lobCode===code){$('pl').innerHTML=list;$('act').innerHTML=act;fitLobby();return}

 ovShow(`<div id="lobw"><h1 id="lobh" style="font-size:min(11vh,60px)">TAG</h1><div id="lob"><div>Room code<div style="font-size:min(13vh,64px);letter-spacing:6px;line-height:1">${esc(code)}</div><div id="qrw"><div id="qr"></div></div></div><div style="text-align:left"><div id="pl">${list}</div><div id="act" style="margin-top:8px">${act}</div></div></div><p id="lobp">Friends join with the code, or by scanning the QR.</p></div>`);
 ov.classList.add('fit');ov.style.opacity='0';ov.style.transition='opacity .15s';
 const drawQR=()=>{const q=$('qr');if(!q||q.firstChild)return 1;if(!window.QRCode)return 0;try{const tmp=document.createElement('div');new QRCode(tmp,{text:BASE+'?room='+code,width:104,height:104});const c=tmp.querySelector('canvas');if(c){const im=new Image(104,104);im.src=c.toDataURL('image/png');im.style.cssText='display:block;width:104px;height:104px';q.appendChild(im);return 1}}catch(e){}return 0};
 if(!drawQR())setTimeout(()=>{if(!drawQR()){const w=$('qrw');if(w){w.style.display='none';fitLobby()}}},1800);
 const shown=()=>{fitLobby();requestAnimationFrame(()=>requestAnimationFrame(()=>{if($('lobw'))ov.style.opacity='1'}))};
 fitLobby();setTimeout(shown,400);

/* ---------- public lobby ---------- */
function pubUI(f){
 const ps=peers.slice(),n=ps.length,full=n>=PUB_SIZE;
 const sig=ps.map(p=>p.peer+(p.presence.nm||'')+(p.presence.ci||0)).join(),live=!ov.classList.contains('off')&&$('pubw');

function step(p,inp,dt){

 if(!inp.j&&p.vy<-260&&!p.cut){p.vy*=.45;p.cut=1}

 p.vy=Math.min(p.vy+(p.vy>0?3400:2300)*dt,1150);

}
