function step(p,inp,dt){

   if(jp){p.vx=Math.max(-ZIP_OUT,Math.min(ZIP_OUT,p.vx));p.vy=-ZIP_HOP;if(!QUIET){burst(p.x+15,p.y+ZIP_HANG,8,'#ffe14d',220);snd(420,.16,'square',.05,420)}}

 const m=(p.it?1.07:1)*(p.bot?.94:1),MAX=340*m*(p.slow?SLOW_K:1)*(p.hb?HELD_K:1)*(p.gt?CARRY_K:1)*(p.bst>0?BST_K:1);

 const ds=inp.s&&!p.ps;p.ps=!!inp.s;
 if(p.dcd>0)p.dcd-=dt;
 if(ds&&p.dcd<=.001&&p.dash<=0){p.dash=DASH_T;p.dcd=DASH_CD;p.dd=ax||p.face;p.face=p.dd;dust(p.x+15,p.y+PH-6,8);snd(520,.14,'sawtooth',.045,-260)}

 else if(ax){const turn=Math.sign(p.vx)==-ax?1.8:1;p.vx+=ax*(p.g?3000:2000)*turn*dt;p.vx=Math.max(-MAX,Math.min(MAX,p.vx));p.face=ax}

 if(p.buf>0&&p.coy>0){p.vy=-840*((p.slow||p.hb)?JUMP_K:1);p.buf=p.coy=0;p.g=0;p.cut=0;p.sq=1.35;if(p.dash>0){p.dash=0;p.vx=Math.max(-MAX,Math.min(MAX,p.vx))}dust(p.x+15,p.y+PH,6);snd(380,.14,'square',.04,320)}

 const ax=ME.x,ay=ME.y,al=Math.min(1,acc*PHYS_HZ);

function cdLeft(){return Math.max(0,S.cdl-(performance.now()-S.cdAt)/1000)}
/* client-side PREDICTION: I move instantly on my own screen and send the inputs; the server's answer corrects me. No tagging, timer or scoring happens here. */
function upd(dt){

function arrowUpd(dt){
 let h=null;

 for(const k in rem)if(rem[k].alive)L.push(rem[k]);
 if(S.mode=='play'&&L.length){let a=1e9,b=-1e9,c=1e9,d=-1e9;L.forEach(p=>{a=Math.min(a,p.x);b=Math.max(b,p.x);c=Math.min(c,p.y);d=Math.max(d,p.y)});

function rr(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r)}
/* ---------- world: pure vector, drawn every frame from pre-batched Path2D ops (no cached bitmap -> no resampling seams) ---------- */
const WORLD=[],FG=[];
function rec(list){let cur=null;return{

function pPoly(p,ox,oy,a,x,y,w,h){const c=Math.cos(a),s=Math.sin(a);[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach((v,i)=>{const X=ox+v[0]*c-v[1]*s,Y=oy+v[0]*s+v[1]*c;i?p.lineTo(X,Y):p.moveTo(X,Y)});p.closePath()}
function buildWorld(){
 const R=rec(WORLD);
 R.f('#3d97f7').rect(LX,-600,RX-LX,WH+600);          /* playfield; the screen is pre-filled pink so walls need no abutting shapes */

 [[775,277,1],[897,451,.62],[1323,512,.7],[128,707,1]].forEach(t=>{const x=t[0],y=t[1],k=t[2];
  R.f('#c4145f').rect(x-9*k,y-95*k,18*k,95*k);
  const c=R.f('#22f07a');c.roundRect(x-45*k,y-150*k,90*k,60*k,12*k);c.roundRect(x-68*k,y-105*k,44*k,26*k,12*k);c.roundRect(x+22*k,y-100*k,50*k,26*k,12*k)});
 const FL=[[155,304,9,'#ff2d7a'],[671,354,10,'#ffb830'],[861,277,6,'#ff2d7a'],[1200,354,10,'#ff2d7a'],[73,536,11,'#ffb830'],[666,536,6,'#ff2d7a'],[978,536,10,'#ffb830'],[514,626,6,'#ff2d7a'],[1198,512,6,'#ffb830'],[1397,712,11,'#ffb830'],[334,800,11,'#ff2d7a'],[1089,800,11,'#ff2d7a']];
 const st=R.f('#8a0e46');FL.forEach(f=>st.rect(f[0]-3,f[1]-f[2]*1.4,6,f[2]*1.4));
 ['#ff2d7a','#ffb830'].forEach(col=>{const p=R.f(col);FL.filter(f=>f[3]==col).forEach(f=>{for(let i=0;i<6;i++){const a=i*1.047;pCirc(p,f[0]+Math.cos(a)*f[2]*.7,f[1]-f[2]*1.6+Math.sin(a)*f[2]*.7,f[2]*.55)}})});
 const ce=R.f('#fff');FL.forEach(f=>pCirc(ce,f[0],f[1]-f[2]*1.6,f[2]*.4));
 const bu=R.f('#2df58a');[[45,304,18],[248,536,26],[912,536,18],[1055,354,18]].forEach(b=>{bu.moveTo(b[0]-b[2],b[1]);bu.arc(b[0],b[1],b[2],Math.PI,0);bu.closePath()});
 [[1154,284,[75,40,95,20]],[468,451,[35]],[1216,712,[28]]].forEach(b=>b[2].forEach((h,i)=>bu.roundRect(b[0]+i*44,b[1]-h,32,h,16)));
 PL.forEach(q=>{const x0=q.x==LX?q.x-400:q.x,w=q.x==LX?q.w+400:q.w;R.f('#ff2d7a').rect(x0,q.y,w,q.h);R.f('#39d353').rect(x0,q.y-2,w,6)});
 /* foreground foliage (drawn over players) */
 const F=rec(FG);const fa=F.f('#2df58a',.94);[[20,722,44],[93,742,44],[162,732,44],[248,742,44]].forEach(h=>fa.roundRect(h[0],h[1],h[2],WH-h[1]+30,22));
 const ft=F.f('#c4145f');ft.rect(218,350,45,34);
 const fl=F.f('#22f07a');fl.roundRect(192,290,98,64,22);fl.roundRect(200,335,14,28,7)}
function drawOps(list){for(const o of list){cx.globalAlpha=o.a;if(o.k=='f'){cx.fillStyle=o.c;cx.fill(o.p)}else{cx.strokeStyle=o.c;cx.lineWidth=o.lw;cx.stroke(o.p)}}cx.globalAlpha=1}
function draw(){
 const s=cam.z*DPR;
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#ff2d7a';cx.fillRect(0,0,cv.width,cv.height);

 /* camera origin snapped to whole device pixels: static scenery never shimmers while the camera pans */

 drawOps(WORLD);drawFeatures();
 if(S.ev&&S.ev.t=='l'&&(S.mode=='play'||S.mode=='over')){const q=PL[S.ev.pi];if(q){if(S.ev.ph==0){cx.globalAlpha=.45+.45*Math.sin(time*18);cx.fillStyle='#ffe14d';cx.fillRect(q.x-3,q.y-4,q.w+6,q.h+6)}else{cx.fillStyle='#ff3b1a';cx.fillRect(q.x,q.y-3,q.w,q.h+3);cx.fillStyle='#ffb830';for(let x=q.x+8;x<q.x+q.w-8;x+=26){cx.beginPath();cx.arc(x,q.y-3,5+Math.sin(time*6+x)*2.5,0,7);cx.fill()}}cx.globalAlpha=1}}

  for(const k in DEC){const d=DEC[k],o=d.o==myId?ME:rem[d.o];if(d.has&&o&&o.it&&o.alive!==false)drawArrow(d.x+PW/2,d.y+PH,1,s,TX,TY)}   /* the decoy of the arrow holder carries an arrow too */

 if(S.mode=='play'&&S.st=='play'&&ME.alive&&cd<=0&&S.ev&&S.ev.t=='b'){const rm=S.ev.rem-(performance.now()-S.ev.at)/1000,a=Math.max(0,Math.min(1,(10-rm)/.3,rm/.3)),X=TX+(ME.x+PW/2)*s,Y=TY+(ME.y+PH/2)*s,r=120*s,g=cx.createRadialGradient(X,Y,r*.55,X,Y,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=a;cx.fillStyle=g;cx.fillRect(0,0,cv.width,cv.height);cx.globalAlpha=1}

}
