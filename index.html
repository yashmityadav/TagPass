/* open a socket and send the first message (quick / create / join / resume); resolves on the server's "hello". Later messages go to onMsg. */
/* pre-warm: open the socket while the player is still typing their name, so pressing Play skips the TCP/TLS handshake (and wakes a sleeping server early) */
let WARM=null,WARM_URL='';
function warm(){if(WARM&&WARM.readyState<=1)return;
 try{const u=window.TAG_WS||((location.protocol=='https:'?'wss://':'ws://')+location.host),w=new WebSocket(u);WARM=w;WARM_URL=u;w.onopen=()=>{try{w.send(authMsg())}catch(e){}};w.onerror=()=>{};w.onmessage=()=>{};w.onclose=()=>{if(WARM===w)WARM=null}}catch(e){WARM=null}}
function takeWarm(url){const w=WARM;if(w&&w.readyState===1&&WARM_URL===url){WARM=null;return w}return null}
function openWS(url,first,wait){return new Promise((resolve,reject)=>{
 let ws,done=0,to=0;
 const fail=c=>{if(done)return;done=1;clearTimeout(to);try{ws&&ws.close()}catch(e){}reject({code:c})};
 const pre=takeWarm(url);
 try{ws=pre||new WebSocket(url)}catch(e){return reject({code:'ws'})}
 to=setTimeout(()=>fail('timeout'),wait||12000);
 ws.onopen=()=>{try{ws.send(authMsg());ws.send(JSON.stringify(first))}catch(e){fail('send')}};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t=='st'){setSt(m);return}
  if(!done){if(m.t=='hello'){done=1;clearTimeout(to);resolve({ws,hello:m})}else if(m.t=='err')fail(m.e||'closed');return}
  onMsg(m,ws)};
 ws.onerror=()=>{if(!done)fail('connect')};
 ws.onclose=()=>{if(!done)fail('closed');else onClose(ws)};
 if(pre)ws.onopen()})}
